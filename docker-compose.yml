services:
  server:
    # Tag must be explicit — without it `compose push` sends an empty tag and
    # the registry answers 400 invalid tag format
    image: zorinalex/assetalchemy_server:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assetalchemy_server
    restart: always
    deploy:
      update_config:
        order: start-first
    environment:
      PORT: 3100
      TEMP_PATH: ../temp
    networks:
      - assetalchemy_network
  client:
    image: zorinalex/assetalchemy_client:latest
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: assetalchemy_client
    restart: always
    ports:
      - "8083:8083"
    deploy:
      update_config:
        order: start-first
    depends_on:
      - server
    networks:
      - assetalchemy_network

networks:
  assetalchemy_network:
    driver: bridge